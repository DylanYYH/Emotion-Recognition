<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirstVoice - Auto Monitor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Specific styles for the feed */
        .feed-container {
            max-width: 600px;
            margin: 20px auto;
            text-align: left;
        }

        .feed-item {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.5s ease-out;
            border-left: 5px solid #5DADE2;
            /* Blue accent */
        }

        .feed-item.fresh {
            border-left-color: #4CAF50;
            /* Green for just now */
        }

        .feed-time {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 5px;
        }

        .feed-emotion {
            font-weight: 600;
            font-size: 1.1rem;
            color: #333333;
        }

        .monitoring-status {
            background: #e8eaed;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 600;
            color: #555;
        }

        .monitoring-status.active {
            background: #e6fffa;
            color: #00796b;
            border: 1px solid #b2f5ea;
        }

        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ccc;
            border-radius: 50%;
            margin-right: 8px;
        }

        .active .pulse-dot {
            background-color: #00796b;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.7;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="hero" style="padding: 2rem 1rem;">
            <div class="logo">
                <img src="logo.png" alt="FirstVoice Logo"> FirstVoice
            </div>
            <h1>Automatic Monitor</h1>
            <p>Continuous listening for your peace of mind.</p>
            <div style="margin-top: 10px;">
                <a href="/" class="secondary-btn"
                    style="text-decoration: none; font-size: 0.9rem; margin-right: 10px;"><i
                        class="fa-solid fa-arrow-left"></i> Dashboard</a>
                <a href="/calendar" class="secondary-btn" style="text-decoration: none; font-size: 0.9rem;"><i
                        class="fa-solid fa-calendar-alt"></i> Care Calendar</a>
            </div>
        </header>

        <main class="input-section">
            <div style="text-align: center;">
                <div id="status-badge" class="monitoring-status">
                    <span class="pulse-dot"></span> <span id="status-text">Inactive</span>
                </div>

                <div>
                    <button id="toggle-monitor-btn" class="primary-btn">Start Monitoring</button>
                </div>

                <div id="activity-feed" class="feed-container">
                    <!-- Events will appear here -->
                </div>
            </div>
        </main>
    </div>

    <script src="auto_mode.js"></script>
</body>

</html>
