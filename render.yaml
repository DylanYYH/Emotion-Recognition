services:
  - type: web
    name: firstvoice
    runtime: python
    plan: pro
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FIRSTVOICE_WARMUP
        value: "1"
      - key: FIRSTVOICE_STORAGE_DIR
        value: /var/data/firstvoice
      - key: FIRSTVOICE_DB
        value: sqlite:////var/data/firstvoice/users.db
    disk:
      name: firstvoice-data
      mountPath: /var/data
      sizeGB: 1
